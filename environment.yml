name: hippie
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Python interpreter
  - python=3.10

  # Core scientific stack (compatible-release upper bounds prevent
  # major-version surprises while letting minor/patch updates through).
  - pytorch>=2.0,<3.0
  - pytorch-lightning>=2.0,<3.0
  - numpy>=1.23,<3.0
  - pandas>=2.0,<3.0
  - scikit-learn>=1.3,<2.0
  - scipy>=1.11,<2.0
  - matplotlib>=3.6,<4.0
  - seaborn>=0.12,<1.0

  # H5 file I/O (needed by hippie_wf3dacg, NEMO baseline, and the figure_supp
  # UMAP clustering script).
  - h5py>=3.8,<4.0

  # Notebook tooling (for inspecting bundled .ipynb files)
  - jupyter
  - ipykernel

  - pip
  - pip:
      # Experiment tracking — opt-in at runtime via WANDB_MODE
      - wandb>=0.15,<1.0
      # UMAP for figure_5 / figure_supp_umap_clustering
      - umap-learn>=0.5,<1.0
      # Test + lint tooling (mirrors pyproject.toml [dev] extras)
      - pytest>=7.0,<10.0
      - pyyaml>=6.0,<7.0
      - black>=22.1,<26.0
      - isort>=5.10,<7.0
      - mypy>=1.0,<2.0
      # Optional — only needed by the NEMO baseline (C4 H5 format)
      # Uncomment to enable NEMO retraining:
      # - npyx>=4.0
      # Optional — only needed for S3 dataset/checkpoint access
      # - boto3>=1.26,<2.0
      # Optional — only needed for raw DANDI .nwb preprocessing
      # - pynwb>=3.0,<4.0
